<style>

<script>

const RUTAS={
scrum:{n:'Scrum Master',e:'🧭',c:'#6D28D9',desc:'Scrum, facilitación, métricas, liderazgo y las herramientas que pide la vacante: Jira, Confluence, Trello, Azure DevOps, Miro, Mural y Office.',
mods:[
{id:'s1',t:'Scrum en 5 minutos (Guía Scrum 2020)',p:[
 '<b>Empirismo</b>: se decide con base en lo observado. Sus 3 pilares son <b>transparencia, inspección y adaptación</b>. Scrum también se apoya en el pensamiento Lean (reducir desperdicio, enfocarse en lo esencial).',
 '<b>5 valores</b>: compromiso, foco, apertura, respeto y coraje.',
 '<b>Scrum Team</b>: normalmente 10 personas o menos, sin subequipos ni jerarquías. Tiene tres responsabilidades: <b>Developers</b> (crean el Incremento), <b>Product Owner</b> (maximiza el valor y gestiona el Product Backlog; es una persona, no un comité) y <b>Scrum Master</b> (responsable de la efectividad del equipo).',
 '<b>Eventos y timeboxes</b> (para un Sprint de un mes; se acortan en Sprints más cortos): Sprint de un mes o menos · Sprint Planning hasta 8 h · Daily Scrum 15 min · Sprint Review hasta 4 h · Sprint Retrospective hasta 3 h.',
 '<b>Artefactos y su compromiso</b>: Product Backlog → <b>Product Goal</b> · Sprint Backlog → <b>Sprint Goal</b> · Incremento → <b>Definition of Done</b>.',
 'Dato de entrevista: la guía de 2020 cambió "Development Team" por <b>Developers</b> y describe al Scrum Master como "un líder verdadero que sirve" (antes "servant leader"). Menciónalo: demuestra que estás actualizado.']},
{id:'s2',t:'Facilitar las ceremonias',p:[
 '<b>Sprint Planning</b> responde tres preguntas: ¿por qué es valioso este Sprint? (Sprint Goal), ¿qué se puede terminar? y ¿cómo se hará? Tu papel: que llegue refinado lo necesario, que el equipo decida cuánto trabajo toma y que salga con un objetivo claro.',
 '<b>Daily Scrum</b> es de y para los Developers: 15 minutos para inspeccionar el avance hacia el Sprint Goal y ajustar el plan. No es un reporte de estatus al Scrum Master. Si se alarga, lleva los temas a una conversación posterior.',
 '<b>Sprint Review</b> es una sesión de trabajo con stakeholders, no solo una demo: se revisa lo logrado, cambios en el entorno y se ajusta el Product Backlog.',
 '<b>Retrospectiva</b>: el equipo inspecciona personas, interacciones, procesos, herramientas y su Definition of Done, y elige mejoras concretas. Formatos útiles: Start/Stop/Continue, 4Ls, Velero (Sailboat), Mad/Sad/Glad, línea del tiempo. Cierra siempre con 1 a 3 acciones con responsable.',
 '<b>Refinamiento</b> no es un evento formal, es una actividad continua para detallar, dividir y estimar elementos del backlog.',
 'Técnicas de facilitación: timeboxing visible, votación por puntos, puño de cinco para medir acuerdo, parking lot para temas fuera de foco, y turnos de palabra para que participen también las personas calladas.']},
{id:'s3',t:'Apoyar al Product Owner y el backlog',p:[
 'Un buen Product Backlog es <b>DEEP</b>: detallado según su prioridad, estimado, emergente y priorizado.',
 'Las historias de usuario siguen <b>INVEST</b>: independientes, negociables, valiosas, estimables, pequeñas y comprobables. Formato: "Como [rol] quiero [acción] para [beneficio]".',
 'Criterios de aceptación en formato <b>Gherkin</b>: Dado [contexto], Cuando [acción], Entonces [resultado].',
 'Priorización: <b>WSJF</b> (costo de retraso ÷ tamaño del trabajo), <b>MoSCoW</b> (Must, Should, Could, Won\'t), matriz valor contra esfuerzo, modelo Kano.',
 'Dividir historias con <b>SPIDR</b>: Spike, Paths (caminos), Interfaces, Data (datos) y Rules (reglas). También por pasos del flujo o camino feliz contra casos de error.',
 'Story mapping (en Miro o Mural): actividades del usuario de izquierda a derecha y prioridad de arriba abajo, para planear entregas por valor.',
 'Tu rol no es priorizar por el PO, sino enseñarle técnicas, facilitar el refinamiento y ayudarle a comunicar el Product Goal a los stakeholders.']},
{id:'s4',t:'Definition of Done y Definition of Ready',p:[
 '<b>Definition of Done (DoD)</b>: descripción formal del estado del Incremento cuando cumple las medidas de calidad. Si la organización tiene un estándar, el equipo debe cumplirlo como mínimo. Si algo no cumple la DoD, no se presenta en la Review ni se libera.',
 'Ejemplo de DoD: código revisado por un par · pruebas automáticas pasando · cobertura mínima acordada · criterios de aceptación validados · desplegado en ambiente de pruebas · documentación en Confluence actualizada · sin defectos críticos abiertos.',
 '<b>Definition of Ready (DoR)</b>: práctica complementaria, <b>no forma parte de la Guía Scrum</b>. Define cuándo un elemento está listo para entrar al Sprint: tiene valor claro, criterios de aceptación, está estimado, no tiene dependencias bloqueantes y cabe en un Sprint.',
 'Riesgo de la DoR: si se vuelve demasiado rígida se convierte en una "puerta" de mini cascada. Úsala como guía para conversar, no como burocracia.']},
{id:'s5',t:'Tableros, métricas e indicadores',p:[
 '<b>Burndown</b>: trabajo restante contra el tiempo del Sprint, con una línea ideal de referencia. Una línea plana varios días suele indicar bloqueos o trabajo mal dividido.',
 '<b>Burnup</b>: trabajo completado contra alcance total. A diferencia del burndown, muestra cuando el alcance cambia.',
 '<b>Velocidad</b>: puntos terminados por Sprint. Úsala en promedio de 3 a 5 Sprints para pronosticar. <b>Nunca</b> para comparar equipos ni como meta de desempeño: los puntos son relativos a cada equipo.',
 'Métricas de flujo: <b>lead time</b> (desde que se pide hasta que se entrega), <b>cycle time</b> (desde que se empieza hasta que se termina), <b>throughput</b> (elementos terminados por periodo), <b>WIP</b> (trabajo en curso) y <b>diagrama de flujo acumulado</b> (una banda que se ensancha indica un cuello de botella).',
 'Calidad: defectos escapados a producción, tasa de retrabajo. Negocio: cumplimiento del Sprint Goal, satisfacción del usuario. Equipo: encuestas de salud del equipo (por ejemplo, el health check de Spotify) y felicidad.',
 'Ley de Goodhart: "cuando una medida se vuelve objetivo, deja de ser buena medida". Las métricas sirven para conversar y mejorar, no para castigar.']},
{id:'s6',t:'Liderazgo y equipos de alto rendimiento',p:[
 'Etapas de Tuckman: <b>formación, conflicto (storming), normalización y desempeño</b>. El conflicto es normal: tu trabajo es que sea sobre ideas y no sobre personas.',
 '<b>Seguridad psicológica</b> (Amy Edmondson): el equipo puede opinar, preguntar y equivocarse sin miedo. El estudio Aristóteles de Google la identificó como el factor más importante de los equipos efectivos.',
 'Las 5 disfunciones de Lencioni: ausencia de confianza, temor al conflicto, falta de compromiso, evitar rendir cuentas y desatención a los resultados.',
 'Posturas del Scrum Master: <b>facilitar</b> (guiar el proceso), <b>enseñar</b> (explicar prácticas), <b>coaching</b> (preguntar para que el equipo encuentre su respuesta) y <b>mentoría</b> (compartir experiencia). Saber cuándo usar cada una es clave.',
 'Autogestión: el equipo decide quién hace qué, cómo y cuándo. Promuévela con acuerdos de trabajo, delegando decisiones y resistiendo la tentación de resolverlo todo tú.',
 'Impedimentos: el Scrum Master ayuda a eliminarlos, pero primero enseña al equipo a resolver los que están a su alcance. Un tablero visible de impedimentos ayuda a darles seguimiento.']},
{id:'s7',t:'Agilidad técnica y DevOps',p:[
 'Prácticas de <b>XP</b>: desarrollo guiado por pruebas (TDD), programación en pareja o en grupo, refactorización, integración continua, propiedad colectiva del código, estándares de código.',
 '<b>CI/CD</b>: cada cambio se integra, se prueba automáticamente y puede desplegarse. <b>Trunk-based development</b> con ramas cortas y <b>feature flags</b> reduce conflictos de integración.',
 'Pirámide de pruebas: muchas pruebas unitarias, menos de integración y pocas de interfaz (end to end).',
 '<b>DevOps</b> se resume en <b>CALMS</b>: Cultura, Automatización, Lean, Medición y compartir (Sharing).',
 'Métricas <b>DORA</b>: frecuencia de despliegue, tiempo de entrega de cambios, tasa de fallas de cambios y tiempo para restaurar el servicio.',
 'Entorno de experimentación segura: spikes con timebox, pruebas A/B, retros sin culpables (blameless) y celebrar lo aprendido aunque el experimento falle.']},
{id:'s8',t:'Escalado y transformación',p:[
 '<b>Scrum of Scrums</b>: representantes de varios equipos se coordinan sobre dependencias e impedimentos compartidos.',
 'Marcos de escalado: <b>Nexus</b> (de Scrum.org, 3 a 9 equipos), <b>LeSS</b> (un solo Product Owner y un solo backlog para varios equipos) y <b>SAFe</b> (Agile Release Train, PI Planning, Release Train Engineer).',
 '<b>Kanban</b>: visualizar el flujo, limitar el WIP, gestionar el flujo y hacer explícitas las políticas. Muchos equipos combinan Scrum con Kanban.',
 'Trabajar con otros Scrum Masters: comunidad de práctica, compartir formatos de retro, un backlog de la transformación y métricas comunes de madurez ágil.',
 'Gestión del cambio: empieza por pilotos, muestra resultados, involucra a líderes y trata la transformación como un producto con su propio backlog.']},
{id:'s9',t:'Jira, Confluence, Trello, Azure DevOps, Miro y Mural',p:[
 '<b>Jira</b>: tableros Scrum (con Sprints) o Kanban (flujo continuo). Jerarquía típica: Epic → Historia, Tarea o Bug → Subtarea. Reportes: Burndown, Velocity, Sprint Report, Control Chart y diagrama de flujo acumulado. Automatizaciones y dashboards con gadgets.',
 '<b>JQL</b> (lenguaje de consultas de Jira): <code>project = APP AND sprint in openSprints() AND assignee = currentUser()</code> · <code>project = APP AND type = Bug AND created >= -14d</code> · <code>project = APP AND statusCategory != Done ORDER BY priority DESC</code> · <code>parent = APP-123</code> (hijos de una épica).',
 '<b>Confluence</b>: espacios y árbol de páginas; plantillas de retrospectiva, notas de reunión, requisitos y registro de decisiones. Se conecta con Jira para mostrar incidencias dentro de una página. Úsalo para la DoD, acuerdos de trabajo y documentación.',
 '<b>Trello</b>: tableros, listas y tarjetas; checklists, etiquetas y fechas; Power-Ups para agregar funciones y Butler para automatizar. Ideal para equipos pequeños o tableros de impedimentos.',
 '<b>Azure DevOps</b>: Boards (con el proceso Scrum: Epic → Feature → Product Backlog Item → Task, más Bugs), Sprints con planeación de capacidad, Repos (Git), Pipelines (CI/CD en YAML), Test Plans y Artifacts.',
 '<b>Miro y Mural</b>: pizarras colaborativas para retros, story mapping, PI Planning y dinámicas remotas. Usa plantillas, marcos, temporizador y votación integrados.']},
{id:'s10',t:'Office nivel avanzado para un Scrum Master',p:[
 '<b>Excel</b>: exporta incidencias de Jira o Azure DevOps a CSV y analízalas con <b>tablas dinámicas</b> y segmentaciones; usa <b>BUSCARX</b> (XLOOKUP), <b>SUMAR.SI.CONJUNTO</b> y <b>CONTAR.SI.CONJUNTO</b> para indicadores.',
 '<b>Power Query</b>: automatiza la limpieza de las exportaciones (quitar columnas, cambiar tipos, combinar Sprints) y actualiza todo con un clic.',
 'Gráficos: burndown con un gráfico de líneas (trabajo restante contra línea ideal), velocidad con columnas y promedio móvil, y formato condicional para resaltar riesgos.',
 '<b>PowerPoint</b>: presentaciones claras para Sprint Reviews y reportes a dirección: una idea por diapositiva, métricas con contexto y próximos pasos.',
 '<b>Teams y Outlook</b>: ceremonias como reuniones recurrentes con agenda; <b>Forms</b> para encuestas de salud del equipo; <b>Planner</b> o Loop para acuerdos.',
 'En entrevista, da un ejemplo concreto: "Armé un tablero en Excel con Power Query conectado a la exportación de Jira que calculaba velocidad y defectos por Sprint".']}
],
flash:[['¿Cuáles son los 3 pilares del empirismo?','Transparencia, inspección y adaptación.'],['¿Cuáles son los 5 valores de Scrum?','Compromiso, foco, apertura, respeto y coraje.'],['Timebox del Daily Scrum','15 minutos, todos los días del Sprint.'],['Timebox de la Sprint Planning (Sprint de un mes)','Hasta 8 horas.'],['Timebox de la Sprint Review (Sprint de un mes)','Hasta 4 horas.'],['Timebox de la Retrospectiva (Sprint de un mes)','Hasta 3 horas.'],['Compromiso del Product Backlog','Product Goal.'],['Compromiso del Sprint Backlog','Sprint Goal.'],['Compromiso del Incremento','Definition of Done.'],['¿La Definition of Ready está en la Guía Scrum?','No. Es una práctica complementaria.'],['¿Qué significa INVEST?','Independiente, Negociable, Valiosa, Estimable, Pequeña (Small) y Testeable.'],['¿Qué es WSJF?','Weighted Shortest Job First: costo de retraso dividido entre el tamaño del trabajo.'],['Diferencia entre burndown y burnup','El burndown muestra trabajo restante; el burnup muestra trabajo completado y el alcance total, así se ven los cambios de alcance.'],['¿Para qué sirve la velocidad?','Para pronosticar cuánto puede entregar el mismo equipo. No para comparar equipos.'],['Lead time contra cycle time','Lead time: desde que se pide hasta que se entrega. Cycle time: desde que se empieza a trabajar hasta que se termina.'],['¿Qué indica una banda que se ensancha en un diagrama de flujo acumulado?','Un cuello de botella en esa etapa.'],['Las 4 métricas DORA','Frecuencia de despliegue, tiempo de entrega de cambios, tasa de fallas de cambios y tiempo para restaurar el servicio.'],['¿Qué significa CALMS?','Cultura, Automatización, Lean, Medición y compartir (Sharing).'],['Etapas de Tuckman','Formación, conflicto, normalización y desempeño.'],['Tamaño recomendado del Scrum Team','10 personas o menos.'],['¿Quién es dueño del Sprint Backlog?','Los Developers.'],['¿Quién puede cancelar un Sprint?','Solo el Product Owner, si el Sprint Goal se vuelve obsoleto.'],['JQL: bugs creados en los últimos 14 días','project = APP AND type = Bug AND created >= -14d'],['Jerarquía de trabajo en Azure DevOps (proceso Scrum)','Epic → Feature → Product Backlog Item → Task (y Bugs).'],['¿Para qué sirve Power Query en tu rol?','Para automatizar la limpieza y combinación de exportaciones de Jira o Azure DevOps y actualizar indicadores con un clic.']],
quiz:[
 {q:'¿Quién es responsable de maximizar el valor del producto?',o:['El Scrum Master','El Product Owner','Los Developers','El gerente del proyecto'],a:1,e:'El Product Owner maximiza el valor y gestiona el Product Backlog.'},
 {q:'El Daily Scrum dura 25 minutos todos los días. ¿Qué haces?',o:['Nada, lo importante es hablar','Ayudar al equipo a mantener el timebox de 15 minutos y llevar los temas largos a otra conversación','Cancelar el Daily','Dirigir tú la reunión y pedir estatus a cada uno'],a:1,e:'El Daily es de 15 minutos y es de los Developers. Tu papel es que ocurra, sea efectivo y respete el timebox.'},
 {q:'¿Cuál es el compromiso del Incremento?',o:['Sprint Goal','Product Goal','Definition of Done','Definition of Ready'],a:2,e:'Cada artefacto tiene un compromiso: el Incremento tiene la Definition of Done.'},
 {q:'Un gerente quiere comparar la velocidad de dos equipos para premiar al "más productivo". ¿Qué respondes?',o:['Es buena idea','Explicas que los puntos son relativos a cada equipo y que compararlos genera inflación de estimaciones; propones métricas de resultado y flujo','Pides que ambos equipos usen los mismos puntos','Le das la velocidad sin comentarios'],a:1,e:'La velocidad no es comparable entre equipos. Ofrece métricas de valor, calidad y flujo.'},
 {q:'¿Qué muestra un burnup que no muestra un burndown?',o:['Los defectos','Los cambios en el alcance total','La felicidad del equipo','El costo'],a:1,e:'El burnup dibuja la línea del alcance total, así se ve cuando crece o disminuye.'},
 {q:'¿Cuál NO es parte de la Guía Scrum?',o:['Sprint Goal','Definition of Done','Definition of Ready','Product Goal'],a:2,e:'La Definition of Ready es una práctica complementaria.'},
 {q:'El equipo nunca termina lo planeado. ¿Qué harías primero?',o:['Pedir que trabajen horas extra','Llevar datos a la retro (velocidad real, WIP, trabajo no planeado) y que el equipo proponga ajustes','Reducir el Sprint a una semana sin consultar','Asignar tú las tareas'],a:1,e:'Hacer visible el problema con datos y dejar que el equipo encuentre mejoras refuerza la autogestión.'},
 {q:'Un diagrama de flujo acumulado muestra la banda "En revisión" cada vez más ancha. Significa:',o:['Todo va bien','Hay un cuello de botella en revisión','El equipo entrega más rápido','Hay menos trabajo'],a:1,e:'Una banda que se ensancha indica que entra más trabajo del que sale de esa etapa.'},
 {q:'¿Qué técnica ayuda a dividir una historia muy grande?',o:['MoSCoW','SPIDR','DORA','CALMS'],a:1,e:'SPIDR: Spike, Paths, Interfaces, Data y Rules.'},
 {q:'¿Quién puede cancelar un Sprint?',o:['El Scrum Master','El Product Owner','Cualquier stakeholder','Los Developers'],a:1,e:'Solo el Product Owner puede cancelarlo, si el Sprint Goal se vuelve obsoleto.'},
 {q:'¿Cuál es una métrica DORA?',o:['Velocidad','Frecuencia de despliegue','Puntos de historia','Horas trabajadas'],a:1,e:'DORA: frecuencia de despliegue, tiempo de entrega de cambios, tasa de fallas y tiempo de recuperación.'},
 {q:'En Jira, ¿qué JQL muestra tu trabajo del Sprint activo?',o:['project = APP AND sprint in openSprints() AND assignee = currentUser()','SELECT * FROM sprint','project = APP AND sprint = activo','assignee = yo AND sprint = hoy'],a:0,e:'openSprints() y currentUser() son funciones de JQL.'},
 {q:'Un miembro del equipo casi no habla en las retros. ¿Qué haces?',o:['Lo ignoras','Usas dinámicas que den voz a todos (escritura silenciosa, votación anónima, rondas) y hablas con él en privado','Lo expones frente al equipo','Le pides que no venga'],a:1,e:'La seguridad psicológica se construye con dinámicas inclusivas y conversaciones uno a uno.'},
 {q:'En Azure DevOps con el proceso Scrum, ¿qué va debajo de una Feature?',o:['Epic','Product Backlog Item','Sprint','Pipeline'],a:1,e:'Epic → Feature → Product Backlog Item → Task.'},
 {q:'¿Qué postura usas cuando haces preguntas para que el equipo encuentre su propia solución?',o:['Mentoría','Enseñanza','Coaching','Dirección'],a:2,e:'El coaching usa preguntas poderosas; la mentoría comparte experiencia propia.'},
 {q:'La Sprint Review es principalmente:',o:['Una demo para aprobar el trabajo','Una sesión de trabajo con stakeholders para inspeccionar el resultado y adaptar el backlog','Una junta de estatus','Una evaluación del desempeño del equipo'],a:1,e:'La Review inspecciona el resultado y decide próximos pasos con los stakeholders.'}
],
ent:[
 {q:'¿Cuál es el rol de un Scrum Master?',r:'Soy responsable de la efectividad del Scrum Team. Lo logro de tres formas: con el equipo, fomentando la autogestión, la calidad y eliminando impedimentos; con el Product Owner, ayudándole a definir el Product Goal y a mantener un backlog claro y priorizado por valor; y con la organización, guiando la adopción de Scrum y quitando barreras entre stakeholders y equipos. No soy el jefe ni el secretario del equipo: soy un líder que sirve.',t:'Menciona las tres "direcciones" de servicio: equipo, Product Owner y organización.'},
 {q:'¿Cómo manejas a un stakeholder que quiere meter trabajo a mitad del Sprint?',r:'Primero entiendo la urgencia y el valor. Después lo dirijo con el Product Owner, que es quien decide sobre el backlog. Si es realmente urgente y pone en riesgo el Sprint Goal, el PO y los Developers negocian qué sale del Sprint o, en casos extremos, el PO puede cancelarlo. Lo importante es proteger el foco del equipo y hacer visible el costo de interrumpir.',t:'Muestra que respetas los roles: tú no decides el contenido, facilitas la decisión.'},
 {q:'Cuéntame de una retrospectiva que no funcionó y qué hiciste.',r:'Usa el método STAR. Situación: las retros se volvieron repetitivas y nadie proponía mejoras. Tarea: recuperar el valor de la retro. Acción: cambié el formato (Velero y luego una línea del tiempo del Sprint), usé escritura silenciosa para que opinaran todos, y limitamos las acciones a dos con responsable y fecha, revisándolas al inicio de la siguiente retro. Resultado: aumentó la participación y en tres Sprints cumplimos 5 de 6 acciones.',t:'Si no tienes experiencia laboral como Scrum Master, usa un proyecto escolar, personal o de voluntariado, y dilo con honestidad.'},
 {q:'¿Qué métricas usarías para saber si el equipo mejora?',r:'Combino cuatro tipos: valor (cumplimiento del Sprint Goal, satisfacción del usuario), flujo (cycle time, throughput, WIP), calidad (defectos escapados, métricas DORA si hay CI/CD) y personas (encuesta de salud del equipo). Las reviso con el equipo como tendencias, no como metas individuales, para evitar que se "maquillen".',t:'Menciona la Ley de Goodhart: demuestra madurez.'},
 {q:'¿Cómo ayudas a un Product Owner con un backlog desordenado?',r:'Empiezo por el Product Goal: si no está claro, lo trabajamos juntos. Luego hacemos un taller de story mapping en Miro para ver el recorrido del usuario, eliminamos o archivamos lo que ya no aporta valor, dividimos las épicas en historias INVEST con criterios de aceptación y priorizamos con una técnica como WSJF o valor contra esfuerzo. Después establecemos refinamientos regulares para que se mantenga así.',t:'Da un proceso concreto y nombra una herramienta.'},
 {q:'¿Qué diferencia hay entre Definition of Done y criterios de aceptación?',r:'Los criterios de aceptación son específicos de cada historia: describen qué debe hacer esa funcionalidad. La Definition of Done aplica a todo el Incremento: es el estándar de calidad común, como pruebas automáticas, revisión de código y documentación. Una historia está terminada cuando cumple sus criterios de aceptación y la DoD.',t:'Pregunta clásica; responde con un ejemplo corto de cada uno.'},
 {q:'¿Cómo creas un entorno de experimentación segura?',r:'Con retrospectivas sin culpables, donde analizamos procesos y no personas; con spikes de tiempo limitado para investigar; promoviendo prácticas como programación en pareja y revisiones de código como aprendizaje; y celebrando lo que aprendemos aunque un experimento no salga. Yo modelo esa actitud reconociendo mis propios errores.',t:'Conecta con la seguridad psicológica.'},
 {q:'¿Qué harías en tus primeros 30 días como Scrum Master de un equipo nuevo?',r:'Primero observar y escuchar: conversaciones uno a uno con cada miembro, el Product Owner y stakeholders clave, y acompañar las ceremonias sin cambiar nada todavía. Después hacer visible el estado actual: tablero, flujo, métricas base y acuerdos de trabajo. Con eso facilito una retrospectiva donde el equipo elija las primeras mejoras. Prefiero ganar confianza antes de proponer cambios grandes.',t:'Muestra que no llegas a imponer.'},
 {q:'¿Cómo trabajarías con otros Scrum Masters en una transformación?',r:'Participando en una comunidad de práctica para compartir formatos, métricas y aprendizajes; coordinando dependencias en un Scrum of Scrums; manteniendo un tablero común de impedimentos organizacionales; y apoyando el backlog de la transformación, tratándola como un producto con objetivos medibles.',t:'Usa las palabras de la vacante: "equipo de transformación y mejora continua".'},
 {q:'Preséntate en un minuto.',r:'Plantilla: "Soy [nombre], ingeniero en informática. Me especializo en [tu enfoque]. Recientemente [proyecto concreto con resultado]. Me interesa este puesto porque [conexión con la empresa]. Lo que aporto es [2 fortalezas]." Por ejemplo, puedes contar cómo desarrollaste un sistema por iteraciones para un negocio real, priorizando con el dueño lo que más valor le daba.',t:'Ensáyalo en voz alta y cronométralo: 60 a 90 segundos.'}
]},
datos:{n:'Ingeniero de datos',e:'🛠️',c:'#0E7490',desc:'Scala, Spark, SQL, modelado, formatos, orquestación, streaming y cómo se trabaja con Jira en un equipo de datos.',
mods:[
{id:'d1',t:'Qué hace un ingeniero de datos',p:[
 'Construye y mantiene <b>pipelines</b> que llevan datos desde las fuentes (bases, APIs, archivos, eventos) hasta donde se analizan, con calidad, a tiempo y a un costo razonable.',
 '<b>ETL</b> transforma antes de cargar; <b>ELT</b> carga primero en el warehouse o lakehouse y transforma ahí (lo más común hoy en la nube).',
 '<b>Batch</b> procesa por lotes programados; <b>streaming</b> procesa eventos casi en tiempo real.',
 '<b>Data lake</b>: archivos crudos y baratos. <b>Data warehouse</b>: datos estructurados para análisis con SQL. <b>Lakehouse</b>: combina ambos con formatos de tabla transaccionales como Delta Lake o Iceberg.',
 'Arquitectura <b>medallion</b>: <b>bronze</b> (crudo), <b>silver</b> (limpio y conformado) y <b>gold</b> (agregado y listo para negocio).']},
{id:'d2',t:'Scala esencial',p:[
 '<code>val</code> es inmutable y <code>var</code> es mutable. En Scala se prefiere la inmutabilidad: evita errores en procesamiento paralelo.',
 'Las <b>case classes</b> modelan datos: traen igualdad por valor, <code>copy</code> y funcionan con pattern matching.',
 '<b>Option</b> reemplaza a los nulos: <code>Some(valor)</code> o <code>None</code>. Se combina con <code>map</code>, <code>getOrElse</code> y <code>fold</code>.',
 'Colecciones inmutables y funciones de orden superior: <code>map</code>, <code>filter</code>, <code>flatMap</code>, <code>foldLeft</code>, <code>groupBy</code>, <code>reduce</code>.',
 '<b>Traits</b> son como interfaces con implementación; los <b>object</b> son singletons, y el companion object guarda métodos de fábrica.',
 'Manejo de errores funcional con <code>Try</code> (Success o Failure) y <code>Either</code> (Left para error, Right para éxito).',
 '<b>sbt</b> es la herramienta de construcción: compila, prueba y empaqueta (por ejemplo, un JAR para Spark).']},
{id:'d3',t:'Spark con Scala',p:[
 '<b>SparkSession</b> es el punto de entrada. Las APIs principales son DataFrame (sin tipo en compilación) y <b>Dataset</b> (con tipo, usando case classes). Los RDD son la API de bajo nivel.',
 '<b>Transformaciones</b> (filter, select, groupBy, join) son perezosas: solo construyen el plan. Las <b>acciones</b> (count, collect, write, show) lo ejecutan.',
 'Transformaciones <b>angostas</b> (filter, map) no mueven datos entre particiones; las <b>anchas</b> (groupBy, join, orderBy) causan un <b>shuffle</b>, que es lo más costoso.',
 '<code>repartition(n)</code> redistribuye con shuffle y puede aumentar o reducir particiones; <code>coalesce(n)</code> solo reduce y evita el shuffle completo.',
 'Optimizar: <b>broadcast join</b> para tablas pequeñas, <code>cache</code> o <code>persist</code> cuando reutilizas un DataFrame, filtrar temprano, evitar UDFs cuando existe una función nativa, y resolver datos sesgados (skew) con salting o con Adaptive Query Execution (AQE).',
 'El optimizador <b>Catalyst</b> genera el plan de ejecución y <b>Tungsten</b> optimiza memoria y CPU. Revisa el plan con <code>df.explain()</code>.']},
{id:'d4',t:'SQL que siempre preguntan',p:[
 'JOINs: INNER (coincidencias), LEFT (todo lo de la izquierda), FULL y cuidado con duplicados al unir por llaves no únicas.',
 '<b>Funciones de ventana</b>: <code>ROW_NUMBER()</code>, <code>RANK()</code>, <code>LAG()</code>/<code>LEAD()</code> y <code>SUM(...) OVER (PARTITION BY ... ORDER BY ...)</code> para acumulados.',
 'Quitar duplicados quedándote con el registro más reciente: <code>ROW_NUMBER() OVER (PARTITION BY id ORDER BY actualizado DESC) = 1</code>.',
 'WHERE filtra filas antes de agrupar; HAVING filtra después de agrupar.',
 'CTEs (<code>WITH</code>) para consultas legibles por pasos.']},
{id:'d5',t:'Modelado de datos',p:[
 '<b>Esquema estrella</b>: una tabla de <b>hechos</b> (eventos medibles, como ventas) rodeada de <b>dimensiones</b> (cliente, producto, fecha).',
 'Define siempre el <b>grano</b>: qué representa una fila de la tabla de hechos (por ejemplo, una línea de ticket).',
 '<b>SCD tipo 1</b> sobrescribe el valor (sin historia). <b>SCD tipo 2</b> guarda historia con nuevas filas y columnas como fecha de inicio, fecha de fin y si es el registro vigente.',
 'Normalizar reduce duplicación (bueno para sistemas transaccionales); desnormalizar acelera lecturas (bueno para análisis).']},
{id:'d6',t:'Formatos y almacenamiento',p:[
 '<b>Parquet</b>: columnar y comprimido; permite leer solo columnas necesarias y filtrar temprano (predicate pushdown). El estándar para análisis.',
 '<b>Avro</b>: por filas, con esquema y buena evolución de esquema; común en streaming con Kafka. <b>ORC</b>: columnar, muy usado en el ecosistema Hive.',
 '<b>Delta Lake</b> e <b>Iceberg</b> agregan transacciones ACID, actualizaciones (MERGE), control de versiones y "viaje en el tiempo" sobre archivos Parquet.',
 'Particiona por columnas con las que filtras seguido (por ejemplo, fecha), pero sin exagerar: demasiadas particiones crean el problema de <b>archivos pequeños</b>.']},
{id:'d7',t:'Orquestación y calidad de datos',p:[
 '<b>Airflow</b> define flujos como <b>DAGs</b> (grafos de tareas con dependencias), con programación, reintentos y alertas. Alternativas en la nube: Azure Data Factory, Cloud Composer, AWS MWAA.',
 '<b>Idempotencia</b>: correr un pipeline dos veces debe dar el mismo resultado (por ejemplo, sobrescribir la partición del día en vez de agregar).',
 '<b>Backfill</b>: reprocesar fechas pasadas; es fácil si el pipeline es idempotente y parametrizado por fecha.',
 'Pruebas de calidad: nulos, unicidad de llaves, rangos válidos, integridad referencial y <b>frescura</b> (¿llegaron los datos de hoy?). Herramientas: Great Expectations, dbt tests o Deequ (para Spark y Scala).',
 'Linaje y monitoreo: saber de dónde viene cada dato y alertar antes de que el negocio note un problema.']},
{id:'d8',t:'Streaming con Kafka y Spark',p:[
 '<b>Kafka</b>: los eventos se publican en <b>topics</b> divididos en <b>particiones</b>; el orden se garantiza dentro de cada partición. Los consumidores se agrupan en <b>consumer groups</b> y avanzan con <b>offsets</b>.',
 '<b>Spark Structured Streaming</b> trata el flujo como una tabla que crece; procesa en micro-lotes.',
 '<b>Watermark</b>: cuánto tiempo esperas datos atrasados en agregaciones por ventana.',
 '<b>Checkpoint</b>: guarda el progreso para recuperarse de fallas. Con fuentes reproducibles y destinos idempotentes se logra procesamiento exactamente una vez.']},
{id:'d9',t:'Jira en un equipo de datos',p:[
 'Historias típicas: "Como analista de ventas quiero la tabla de ventas diarias actualizada a las 7:00 para preparar el reporte matutino".',
 'Criterios de aceptación medibles: frescura, conteo de filas conciliado con la fuente, cero duplicados en la llave, documentación en Confluence.',
 'Definition of Done para datos: pruebas de calidad automáticas, código revisado, pipeline desplegado con CI/CD, monitoreo y alertas configuradas, linaje documentado.',
 'Usa <b>spikes</b> para investigar fuentes nuevas con timebox, y registra los incidentes de datos como Bugs con su causa raíz.',
 'JQL útil: <code>project = DATA AND labels = pipeline-ventas AND statusCategory != Done</code>.']}
],
code:[
 {t:'Case class, colecciones y agregación en Scala',c:`case class Venta(id: Long, cliente: String, monto: Double)

val ventas = List(
  Venta(1, "Ana", 250.0),
  Venta(2, "Luis", 120.5),
  Venta(3, "Ana", 80.0)
)

// Total por cliente
val totalPorCliente: Map[String, Double] =
  ventas.groupBy(_.cliente).map { case (c, vs) => c -> vs.map(_.monto).sum }
// Map(Ana -> 330.0, Luis -> 120.5)`},
 {t:'Pattern matching y Option',c:`def nivel(monto: Double): String = monto match {
  case m if m >= 1000 => "alto"
  case m if m >= 100  => "medio"
  case _              => "bajo"
}

val correo: Option[String] = Some("ana@empresa.com")
val dominio = correo.map(_.split("@")(1)).getOrElse("sin correo")`},
 {t:'Pipeline con Spark: de bronze a gold',c:`import org.apache.spark.sql.SparkSession
import org.apache.spark.sql.functions._

val spark = SparkSession.builder.appName("ventas-diarias").getOrCreate()

val ventas = spark.read.parquet("s3://datos/bronze/ventas/")

val resumen = ventas
  .filter(col("monto") > 0)
  .withColumn("fecha", to_date(col("fecha_hora")))
  .groupBy("fecha", "cliente_id")
  .agg(sum("monto").as("total"), count(lit(1)).as("transacciones"))

resumen.write
  .mode("overwrite")
  .partitionBy("fecha")
  .parquet("s3://datos/gold/ventas_diarias/")`},
 {t:'Quitar duplicados y broadcast join',c:`import org.apache.spark.sql.expressions.Window

val w = Window.partitionBy("id").orderBy(col("actualizado").desc)

val sinDuplicados = df
  .withColumn("rn", row_number().over(w))
  .filter(col("rn") === 1)
  .drop("rn")

// La tabla de clientes es pequeña: se envía a todos los nodos y se evita el shuffle
val enriquecido = sinDuplicados.join(broadcast(clientes), Seq("cliente_id"), "left")`}
],
flash:[['val contra var','val es inmutable; var es mutable. Se prefiere val.'],['¿Qué aporta una case class?','Igualdad por valor, copy, toString útil y soporte para pattern matching.'],['¿Para qué sirve Option?','Para representar un valor que puede faltar sin usar null: Some(x) o None.'],['Transformación contra acción en Spark','Las transformaciones son perezosas y construyen el plan; las acciones lo ejecutan.'],['¿Qué es un shuffle?','Mover datos entre particiones por operaciones anchas como groupBy o join. Es lo más costoso.'],['repartition contra coalesce','repartition hace shuffle y puede subir o bajar particiones; coalesce solo reduce y evita el shuffle completo.'],['¿Cuándo usar broadcast join?','Cuando una de las tablas es pequeña y cabe en memoria de cada nodo.'],['DataFrame contra Dataset','Dataset tiene tipo en compilación (case classes); DataFrame es un Dataset[Row] sin tipo.'],['ETL contra ELT','ETL transforma antes de cargar; ELT carga y transforma dentro del warehouse.'],['Capas medallion','Bronze (crudo), silver (limpio) y gold (listo para negocio).'],['SCD tipo 2','Guarda historia agregando filas nuevas con fechas de vigencia.'],['¿Por qué Parquet?','Es columnar y comprimido: lee solo las columnas necesarias y filtra temprano.'],['¿Qué es idempotencia en un pipeline?','Correrlo varias veces produce el mismo resultado.'],['¿Qué es un watermark?','El límite de espera para datos atrasados en agregaciones de streaming.'],['Orden en Kafka','Se garantiza solo dentro de una partición.'],['WHERE contra HAVING','WHERE filtra antes de agrupar; HAVING después.'],['¿Qué es el grano de una tabla de hechos?','Lo que representa una sola fila.'],['¿Para qué sirve df.explain()?','Para ver el plan de ejecución de Spark y detectar shuffles o scans costosos.']],

ent:[
 {q:'Explica la diferencia entre transformaciones y acciones en Spark.',r:'Las transformaciones, como filter, select o join, son perezosas: Spark solo registra el plan. Las acciones, como count, show o write, disparan la ejecución. Esto permite que el optimizador Catalyst combine y reordene pasos, por ejemplo, empujando filtros antes de un join. Además distingo transformaciones angostas, que no mueven datos, de anchas, que generan shuffle y son las más costosas.',t:'Termina con un ejemplo de optimización: "filtrar antes del join".'},
 {q:'¿Cómo optimizarías un job de Spark lento?',r:'Primero mido: reviso la Spark UI y el plan con explain para ver en qué etapa se va el tiempo. Luego busco las causas típicas: shuffles innecesarios, datos sesgados, archivos pequeños, UDFs que podrían ser funciones nativas o DataFrames recalculados. Las soluciones dependen del caso: filtrar y proyectar temprano, broadcast de tablas pequeñas, salting o AQE para el sesgo, ajustar particiones, cache de datos reutilizados y escribir en Parquet particionado.',t:'Empieza por "medir primero": demuestra método.'},
 {q:'¿Por qué Scala para ingeniería de datos?',r:'Spark está escrito en Scala, así que tengo acceso completo a su API y a Datasets tipados, que detectan errores en compilación. Scala es funcional e inmutable por defecto, lo que encaja con el procesamiento distribuido, y corre en la JVM, con todo el ecosistema de Java. Aun así, sé que PySpark es muy común y me adapto al estándar del equipo.',t:'Muestra flexibilidad: no desprecies Python.'},
 {q:'Diseña un pipeline de ventas diarias.',r:'Ingesta: extraigo de la fuente a la capa bronze en Parquet, particionado por fecha. Transformación en Spark: limpio tipos, quito duplicados con una ventana por id y conformo catálogos en silver. Agrego ventas por día, tienda y producto en gold. Orquesto con Airflow o Data Factory, con reintentos y parámetro de fecha para poder hacer backfill. El pipeline es idempotente porque sobrescribe la partición del día. Agrego pruebas de calidad (conteos, nulos, frescura) y alertas, y documento en Confluence.',t:'Sigue siempre el orden: ingesta, transformación, almacenamiento, orquestación, calidad y monitoreo.'},
 {q:'¿Qué harías si los datos de un reporte vienen mal?',r:'Primero contengo: aviso a los usuarios afectados y, si es necesario, marco el reporte como en revisión. Luego rastreo con el linaje en qué etapa aparece el error, comparando conteos entre fuente, silver y gold. Corrijo la causa raíz, reproceso las fechas afectadas con un backfill y agrego una prueba de calidad para que no se repita. Al final lo documento como Bug en Jira con su causa raíz.',t:'Estructura: contener, diagnosticar, corregir, prevenir, documentar.'},
 {q:'¿Cómo trabajas con Jira en un equipo de datos?',r:'Escribo historias con valor para el usuario de los datos y criterios de aceptación medibles, como frescura o conciliación de conteos. Divido trabajos grandes por fuente o por capa. Uso spikes con timebox para explorar fuentes nuevas, registro incidentes como Bugs con causa raíz y me apoyo en una Definition of Done que incluye pruebas de calidad, revisión de código y monitoreo.',t:'Combina lo ágil con lo técnico: es tu ventaja si también te preparas como Scrum Master.'}
]},
cloud:{n:'Cloud y DevOps',e:'☁️',c:'#1D4ED8',desc:'Fundamentos de nube, equivalencias entre AWS, Azure y GCP, datos en la nube, seguridad, CI/CD, contenedores, Terraform y costos.',
mods:[
{id:'c1',t:'Fundamentos de la nube',p:[
 'Características (NIST): autoservicio bajo demanda, acceso amplio por red, recursos compartidos, <b>elasticidad</b> rápida y servicio medido (pagas por lo que usas).',
 'Modelos de servicio: <b>IaaS</b> (máquinas y redes: tú administras el sistema operativo), <b>PaaS</b> (plataforma administrada: tú pones código y datos), <b>SaaS</b> (software listo) y <b>serverless</b> (funciones que escalan solas y cobran por ejecución).',
 'Modelos de despliegue: nube pública, privada, híbrida y multinube.',
 '<b>Regiones</b> (ubicaciones geográficas) con varias <b>zonas de disponibilidad</b> (centros de datos independientes). Desplegar en varias zonas da alta disponibilidad.',
 '<b>Modelo de responsabilidad compartida</b>: el proveedor protege la infraestructura física; tú proteges tus datos, identidades y configuración. En IaaS tu parte es mayor que en SaaS.',
 'Economía: pasas de <b>CapEx</b> (comprar servidores) a <b>OpEx</b> (gasto operativo por uso).']},
{id:'c2',t:'Equivalencias AWS, Azure y GCP',tabla:[['Servicio','AWS','Azure','Google Cloud'],['Almacenamiento de objetos','S3','Blob Storage / Data Lake Storage Gen2','Cloud Storage'],['Máquinas virtuales','EC2','Virtual Machines','Compute Engine'],['Funciones serverless','Lambda','Azure Functions','Cloud Run functions'],['Data warehouse','Redshift','Synapse Analytics / Microsoft Fabric','BigQuery'],['Spark administrado','EMR / Databricks','Azure Databricks / HDInsight','Dataproc / Databricks'],['ETL e integración','Glue','Data Factory','Dataflow / Data Fusion'],['Streaming','Kinesis / MSK (Kafka)','Event Hubs','Pub/Sub'],['Orquestación (Airflow)','MWAA','Data Factory / Fabric','Cloud Composer'],['Kubernetes','EKS','AKS','GKE'],['Identidad','IAM','Microsoft Entra ID','Cloud IAM'],['Secretos y llaves','Secrets Manager / KMS','Key Vault','Secret Manager / Cloud KMS'],['Infraestructura como código','CloudFormation','ARM / Bicep','Deployment Manager'],['CI/CD','CodePipeline','Azure DevOps Pipelines','Cloud Build']],p:['Terraform funciona con las tres nubes y es muy pedido en vacantes. Si la vacante menciona Azure DevOps, es probable que la empresa use Azure.']},
{id:'c3',t:'Datos en la nube',p:[
 'Patrón típico: fuentes → almacenamiento de objetos (el lago, en capas bronze, silver y gold) → procesamiento con Spark (Databricks, EMR, Dataproc) → warehouse (BigQuery, Synapse, Redshift) → BI (Power BI, Looker, Tableau).',
 'Serverless para datos: BigQuery y Athena permiten consultar con SQL sin administrar servidores; cobran por datos escaneados, así que particionar y usar Parquet ahorra dinero.',
 'Integración: Data Factory y Glue mueven y transforman datos con conectores y programación.',
 'Streaming: Event Hubs, Kinesis y Pub/Sub reciben eventos; Spark Structured Streaming o Dataflow los procesan.',
 'Gobierno: catálogo de datos (Unity Catalog, Purview, Glue Data Catalog, Dataplex), permisos por columna y linaje.']},
{id:'c4',t:'Seguridad e identidad',p:[
 '<b>Mínimo privilegio</b>: cada identidad tiene solo los permisos que necesita. Usa <b>roles</b> y grupos, no permisos por persona.',
 '<b>MFA</b> para usuarios; identidades administradas o cuentas de servicio para aplicaciones, nunca contraseñas en el código.',
 'Cifrado <b>en reposo</b> y <b>en tránsito</b>; llaves en KMS o Key Vault; secretos en un gestor de secretos.',
 'Red: <b>VPC o VNet</b> con subredes públicas y privadas, grupos de seguridad o NSG como firewall, y private endpoints para que los servicios no queden expuestos a internet.',
 'Auditoría y monitoreo: CloudTrail, Azure Monitor o Cloud Audit Logs para saber quién hizo qué.']},
{id:'c5',t:'DevOps: CI/CD, contenedores e IaC',p:[
 '<b>CI</b>: cada cambio se integra y se prueba automáticamente. <b>CD</b>: el cambio queda listo para desplegarse (entrega continua) o se despliega solo (despliegue continuo).',
 'Etapas de un pipeline: compilar → pruebas unitarias → análisis de calidad y seguridad → empaquetar → desplegar a pruebas → aprobación → producción.',
 'Estrategias de despliegue: <b>blue/green</b> (dos ambientes y se cambia el tráfico), <b>canary</b> (se libera a un porcentaje pequeño primero) y rolling (por lotes).',
 '<b>Docker</b>: una imagen es la plantilla; un contenedor es una instancia en ejecución. El Dockerfile define cómo construir la imagen.',
 '<b>Kubernetes</b>: los pods ejecutan contenedores; los Deployments mantienen réplicas; los Services exponen la aplicación.',
 '<b>Terraform</b>: describes la infraestructura en código; <code>terraform plan</code> muestra los cambios y <code>terraform apply</code> los aplica; el <b>state</b> guarda lo que existe (se almacena remoto y bloqueado en equipos).',
 'Observabilidad: <b>logs, métricas y trazas</b>, con alertas basadas en objetivos de servicio (SLO).']},
{id:'c6',t:'Costos y buenas prácticas',p:[
 'Pilares del AWS Well-Architected Framework: excelencia operativa, seguridad, confiabilidad, eficiencia de desempeño, optimización de costos y sostenibilidad. Azure y Google tienen marcos equivalentes.',
 'Ahorro: etiquetas (tags) por equipo y proyecto, autoescalado, apagar ambientes de desarrollo fuera de horario, instancias reservadas o de compromiso para cargas estables, instancias spot para trabajos tolerantes a interrupciones y reglas de ciclo de vida para mover datos viejos a almacenamiento frío.',
 'Presupuestos y alertas de costo desde el primer día.',
 'Certificaciones de entrada recomendadas: AZ-900 y DP-900 (Azure), AWS Certified Cloud Practitioner, Google Cloud Digital Leader; para datos, Databricks Data Engineer Associate; para Scrum, PSM I de Scrum.org.']}
],

const SPRINTS={'sprint 12':'open','sprint 11':'closed'};
const CAT={'to do':'To Do','in progress':'In Progress','in review':'In Progress','done':'Done'};
const ALIAS_TIPO={historia:'story',tarea:'task','épica':'epic',epica:'epic',error:'bug'};
function tokenizar(s){
  const t=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==='('||c===')'||c===','){t.push({k:c});i++;continue}
    if(c==='"'||c==="'"){const j=s.indexOf(c,i+1);if(j<0)throw 'Falta cerrar una comilla.';t.push({k:'val',v:s.slice(i+1,j)});i=j+1;continue}
    const op=/^(!=|>=|<=|!~|=|>|<|~)/.exec(s.slice(i));if(op){t.push({k:'op',v:op[1]});i+=op[1].length;continue}
    const w=/^[A-Za-z0-9_\-\.áéíóúñÁÉÍÓÚÑ]+(\(\))?/.exec(s.slice(i));if(w){const v=w[0];const up=v.toUpperCase();
      if(['AND','OR','NOT','IN','IS','EMPTY','NULL','ORDER','BY','ASC','DESC'].includes(up)&&!w[1])t.push({k:up});else t.push({k:w[1]?'fn':'val',v});i+=v.length;continue}
    throw `No entiendo el carácter "${c}".`;
  }return t;
}
function parsear(s){
  const t=tokenizar(s);let p=0;const ver=()=>t[p],tom=k=>{if(t[p]&&t[p].k===k)return t[p++];return null};
  const exigir=(k,msg)=>{const x=tom(k);if(!x)throw msg;return x};
  function expr(){let a=term();while(tom('OR')){const b=term();const x=a;a=it=>x(it)||b(it)}return a}
  function term(){let a=fact();while(tom('AND')){const b=fact();const x=a;a=it=>x(it)&&b(it)}return a}
  function fact(){if(tom('NOT')){const f=fact();return it=>!f(it)}if(tom('(')){const e=expr();exigir(')','Falta cerrar un paréntesis.');return e}return clausula()}
  function valor(){const x=t[p];if(!x)throw 'Falta un valor al final de la consulta.';if(x.k!=='val'&&x.k!=='fn')throw 'Falta un valor después del operador. Si el valor tiene espacios, ponlo entre comillas: "In Review".';p++;return x}
  function clausula(){
    const f=t[p];if(!f||f.k!=='val')throw 'Esperaba un campo, por ejemplo: project, type, status, priority, assignee, labels, created, sprint o parent.';p++;
    const campo=f.v.toLowerCase();
    if(!['project','type','issuetype','status','statuscategory','priority','assignee','labels','created','sprint','parent','key','summary','text'].includes(campo))throw `El campo "${f.v}" no existe en este laboratorio.`;
    if(tom('IS')){const neg=!!tom('NOT');if(!tom('EMPTY')&&!tom('NULL'))throw 'Después de IS va EMPTY (o IS NOT EMPTY).';return it=>{const v=get(it,campo);const vac=v==null||(Array.isArray(v)&&!v.length);return neg?!vac:vac}}
    let neg=false;if(ver()&&ver().k==='NOT'){p++;neg=true;if(!(ver()&&ver().k==='IN'))throw 'Después de NOT esperaba IN.'}
    if(tom('IN')){if(ver()&&ver().k==='fn'){const fx=valor();return it=>{const v=get(it,campo);if(v==null)return neg;const r=coincide(it,campo,'=',fx);return neg?!r:r}}
      exigir('(','Después de IN van paréntesis: in (High, Highest).');const vs=[valor()];while(tom(','))vs.push(valor());exigir(')','Falta cerrar el paréntesis de la lista.');
      return it=>{const v=get(it,campo);if(v==null||(Array.isArray(v)&&!v.length))return false;const r=vs.some(x=>coincide(it,campo,'=',x));return neg?!r:r}}
    const op=tom('op');if(!op)throw `Después de "${f.v}" esperaba un operador: =, !=, in, >, <, >=, <= o is.`;
    const x=valor();return it=>{const v=get(it,campo);if(v==null||(Array.isArray(v)&&!v.length))return false;return coincide(it,campo,op.v,x)}
  }
  const e=expr();
  if(tom('ORDER')){exigir('BY','Después de ORDER va BY.');valor();tom('ASC')||tom('DESC');while(tom(',')){valor();tom('ASC')||tom('DESC')}}
  if(p<t.length)throw 'Sobra algo al final de la consulta. ¿Te faltó un AND u OR?';
  return e;
}
function get(it,c){if(c==='issuetype')c='type';if(c==='statuscategory')return CAT[it.status.toLowerCase()];if(c==='text')return it.summary;if(c==='created')return it.hace;return it[c]}
function norm(s){return String(s).toLowerCase().trim()}
function coincide(it,campo,op,x){
  let v=get(it,campo);
  if(x.k==='fn'){const fn=x.v.toLowerCase();
    if(fn==='currentuser()'){x={v:YO}}
    else if(fn==='opensprints()'||fn==='closedsprints()'){if(campo!=='sprint')throw `${x.v} solo funciona con el campo sprint.`;const est=fn.startsWith('open')?'open':'closed';const r=v&&SPRINTS[norm(v)]===est;return op==='!='?!r:r}
    else throw `La función ${x.v} no está disponible en este laboratorio.`}
  if(campo==='created'){const m=/^(-?\d+)([dw])$/.exec(x.v);if(!m)throw 'Para fechas usa formato relativo como -7d (hace 7 días) o -2w (hace 2 semanas).';
    const lim=parseInt(m[1])*(m[2]==='w'?7:1),val=-v;return {'>=':val>=lim,'>':val>lim,'<=':val<=lim,'<':val<lim,'=':val===lim,'!=':val!==lim}[op]}
  if(['>','<','>=','<='].includes(op)){if(campo==='priority'){const o=['lowest','low','medium','high','highest'];const a=o.indexOf(norm(v)),b=o.indexOf(norm(x.v));return {'>':a>b,'<':a<b,'>=':a>=b,'<=':a<=b}[op]}throw `El operador ${op} no aplica al campo ${campo}.`}
  let val=norm(x.v);if(campo==='type'||campo==='issuetype')val=ALIAS_TIPO[val]||val;
  if(op==='~'||op==='!~'){const r=norm(v).includes(val);return op==='~'?r:!r}
  const r=Array.isArray(v)?v.some(e=>norm(e)===val):norm(v)===val;
  return op==='!='?!r:r;
}
function ejecutarJQL(q){const f=parsear(q);return INCIDENCIAS.filter(f).map(i=>i.key)}

   <div class="kpis"><div><b>${r.vel}</b><small>puntos terminados (velocidad)</small></div><div><b>${r.metaOk?'✅':'❌'}</b><small>Sprint Goal ${r.metaOk?'cumplido':'no cumplido'}</small></div><div><b>${r.hechos}</b><small>elementos en "Hecho"</small></div></div>
   <div class="burnbig">${burndownSVG(560,200)}</div>
   <h3 class="sub">Planeación</h3><ul class="fb">${J.fbPlan.map(([k,t])=>`<li class="${k}">${esc(t)}</li>`).join('')}</ul>
   <h3 class="sub">Decisiones durante el Sprint (${r.dec}/30)</h3><ul class="fb">${J.decis.map(d=>{const o=EVENTOS[d.dia].ops.find(x=>x.p===d.p);return `<li class="${d.p>=10?'bien':'mal'}"><b>Día ${d.dia}:</b> ${esc(o.e)}</li>`}).join('')}</ul>
   <h3 class="sub">Para la retrospectiva</h3><ul class="fb">
    ${r.sin.length?`<li class="mal">Quedaron sin terminar: ${r.sin.map(c=>c.k).join(', ')}. Regresan al Product Backlog y el PO decide su prioridad; no se "pasan" automáticamente al siguiente Sprint.</li>`:'<li class="bien">El equipo terminó todo lo planeado.</li>'}
    ${J.wipAviso?'<li class="mal">Hubo más de 3 tarjetas en curso al mismo tiempo. Limitar el WIP ayuda a terminar antes.</li>':'<li class="bien">Respetaste el límite de trabajo en curso.</li>'}
    <li>En la entrevista puedes contar: "Practiqué un Sprint completo: planeación con velocidad y capacidad, manejo de cambios de alcance, impedimentos y un incidente en producción".</li></ul>
   <button class="btn primary" id="otroSprint">Jugar otro Sprint</button></div>`}
/* ---------- JQL ---------- */
function vJQL(){
  const i=V.jq??0,r=RETOS_JQL[i],hechos=(P.lab&&P.lab.jql)||{};
  return `<div class="jqlgrid"><div class="card"><div class="cardhead"><h2>Reto ${i+1} de ${RETOS_JQL.length}</h2><span class="pill">${Object.keys(hechos).length} resueltos</span></div>
    <p class="reto">${esc(r.t)}</p>
    <label class="jqlin"><span>Consulta JQL</span><textarea id="jqlQ" rows="3" spellcheck="false" placeholder="project = APP AND type = Bug">${esc(V.jqlTxt??'')}</textarea></label>
    <div class="simbtns"><button class="btn primary" id="jqlRun">Ejecutar</button><button class="btn" id="jqlPista">Pista</button><button class="btn ghost" id="jqlSol">Ver solución</button></div>
    <div id="jqlOut">${V.jqlOut||''}</div>
    <div class="retonav">${RETOS_JQL.map((_,k)=>`<button data-jq="${k}" class="${k===i?'on':''} ${hechos[k]?'ok':''}" aria-label="Reto ${k+1}">${hechos[k]?'✓':k+1}</button>`).join('')}</div></div>
   <div class="card"><h3>Guía rápida</h3><ul class="guia"><li><code>=  !=  in (a, b)  not in</code></li><li><code>is EMPTY</code> · <code>is not EMPTY</code></li><li><code>&gt; &lt; &gt;=</code> con priority y created</li><li><code>created &gt;= -7d</code> (últimos 7 días)</li><li><code>currentUser()</code> · <code>openSprints()</code> · <code>closedSprints()</code></li><li><code>AND  OR  NOT  ( )</code> · <code>ORDER BY priority DESC</code></li><li><code>summary ~ palabra</code> (contiene)</li></ul>
    <p class="muted small">Campos: project, type, status, statusCategory, priority, assignee, labels, created, sprint, parent, summary. Tú eres el usuario <b>jose</b>. Hay ${INCIDENCIAS.length} incidencias en APP y DATA.</p></div></div>`;
}
function tablaInc(keys,marca){const set=new Set(marca||[]);return `<div class="tw"><table class="inc"><thead><tr><th>Clave</th><th>Tipo</th><th>Resumen</th><th>Estado</th><th>Prioridad</th><th>Responsable</th></tr></thead><tbody>${keys.map(k=>{const it=INCIDENCIAS.find(x=>x.key===k);return `<tr class="${marca&&!set.has(k)?'extra':''}"><td>${it.key}</td><td>${it.type}</td><td>${esc(it.summary)}</td><td>${it.status}</td><td>${it.priority}</td><td>${it.assignee||'<i>Sin asignar</i>'}</td></tr>`}).join('')}</tbody></table></div>`}
function correrJQL(){
  const i=V.jq??0,r=RETOS_JQL[i],q=$('jqlQ').value.trim();V.jqlTxt=q;if(!q)return;
  let tuyo;try{tuyo=ejecutarJQL(q)}catch(e){V.jqlOut=`<div class="exp mal">⚠️ ${esc(String(e))}</div>`;$('jqlOut').innerHTML=V.jqlOut;return}
  const esp=ejecutarJQL(r.r),ok=tuyo.length===esp.length&&tuyo.every(k=>esp.includes(k));
  if(ok){P.lab=P.lab||{};P.lab.jql=P.lab.jql||{};P.lab.jql[i]=true;guardar()}
  const faltan=esp.filter(k=>!tuyo.includes(k)),sobran=tuyo.filter(k=>!esp.includes(k));
  V.jqlOut=(ok?`<div class="exp bien"><b>¡Correcto!</b> Tu consulta devuelve exactamente las ${esp.length} incidencias esperadas.${i+1<RETOS_JQL.length?' <button class="btn sm" id="jqlNext">Siguiente reto →</button>':''}</div>`
    :`<div class="exp mal"><b>Todavía no.</b> Tu consulta devuelve ${tuyo.length} resultado${tuyo.length===1?'':'s'}; se esperaban ${esp.length}.${faltan.length?` Faltan: ${faltan.join(', ')}.`:''}${sobran.length?` Sobran: ${sobran.join(', ')} (marcadas abajo).`:''}</div>`)
    +(tuyo.length?tablaInc(tuyo,ok?null:esp):'<p class="muted">Sin resultados.</p>');
  render();
}
/* ---------- Scala ---------- */
function vScala(){
  const S=V.sc;const best=(P.lab&&P.lab.scala)||0;
  if(!S)return `<div class="card center"><h2>Ejercicios de Scala</h2><p class="muted">${RETOS_SCALA.length} ejercicios de "¿qué imprime?" y "completa el código", de lo básico a Spark. Tu mejor resultado: <b>${best?best+'%':'aún no'}</b>.</p><button class="btn primary" id="scEmp">Comenzar</button><p class="muted small">Tip: copia cualquier ejercicio en <b>scastie.scala-lang.org</b> para correrlo y experimentar.</p></div>`;
  if(S.i>=RETOS_SCALA.length){const p=Math.round(S.ok/RETOS_SCALA.length*100);return `<div class="card center">${anillo(p,p>=80?'#16A34A':p>=60?'#D97706':'#DC2626',110)}<h2>${S.ok} de ${RETOS_SCALA.length} correctas</h2><p class="muted">${p>=80?'¡Buen dominio de Scala para una entrevista junior!':'Repasa la lección de Scala esencial y vuelve a intentarlo.'}</p><button class="btn primary" id="scEmp">Otra vez</button></div>`}
  const r=S.qs[S.i];
  return `<div class="card quiz"><div class="qtop"><span class="pill">${r.n} · ${S.i+1} de ${RETOS_SCALA.length}</span><div class="bar"><b style="width:${S.i/RETOS_SCALA.length*100}%"></b></div></div>
   <div class="code"><pre><code>${resaltar(r.c)}</code></pre></div><h2>${esc(r.q)}</h2>
   <div class="ops">${r.o.map((o,j)=>`<button class="op ${S.r!=null?(j===r.a?'bien':j===S.r?'mal':''):''}" data-sco="${j}" ${S.r!=null?'disabled':''}><span class="ol">${'ABCD'[j]}</span><code>${esc(o)}</code></button>`).join('')}</div>
   ${S.r!=null?`<div class="exp ${S.r===r.a?'bien':'mal'}"><b>${S.r===r.a?'Correcto.':'No exactamente.'}</b> ${esc(r.e)}</div><button class="btn primary" id="scSig">${S.i+1<RETOS_SCALA.length?'Siguiente':'Ver resultado'}</button>`:''}</div>`;
}
/* ---------- Eventos del laboratorio ---------- */
function montarLab(){
  document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{V.lt=b.dataset.lt;render()});
  const t=V.lt||'jira';
  if(t==='jira'){
    document.querySelectorAll('[data-meta]').forEach(r=>r.onchange=()=>{J.meta=+r.dataset.meta;render()});
    document.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{const k=b.dataset.bk;J.sel.has(k)?J.sel.delete(k):J.sel.add(k);render()});
    $('iniciar')&&($('iniciar').onclick=iniciarSprint);
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{if(J.pend)return;const c=J.tarjetas.find(x=>x.k===b.dataset.mv);if(c&&c.col==='todo'){c.col='doing';render()}});
    $('sigDia')&&($('sigDia').onclick=siguienteDia);
    document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>decidir(+b.dataset.ev));
    $('otroSprint')&&($('otroSprint').onclick=()=>{nuevoSprint();render();window.scrollTo({top:0})});
  }
  if(t==='jql'){
    const q=$('jqlQ');q.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey||!e.shiftKey)){e.preventDefault();correrJQL()}};q.oninput=()=>V.jqlTxt=q.value;
    $('jqlRun').onclick=correrJQL;
    $('jqlPista').onclick=()=>{V.jqlOut=`<div class="exp">💡 ${esc(RETOS_JQL[V.jq??0].p)}</div>`;$('jqlOut').innerHTML=V.jqlOut};
    $('jqlSol').onclick=()=>{const r=RETOS_JQL[V.jq??0];V.jqlTxt=r.r;V.jqlOut='';render();toast('Ejecútala para ver el resultado y luego intenta escribirla tú sin verla.')};
    document.querySelectorAll('[data-jq]').forEach(b=>b.onclick=()=>{V.jq=+b.dataset.jq;V.jqlTxt='';V.jqlOut='';render()});
    $('jqlNext')&&($('jqlNext').onclick=()=>{V.jq=(V.jq??0)+1;V.jqlTxt='';V.jqlOut='';render()});
  }
  if(t==='scala'){
    $('scEmp')&&($('scEmp').onclick=()=>{const qs=RETOS_SCALA.map(q=>{const idx=q.o.map((_,j)=>j).sort(()=>Math.random()-.5);return{...q,o:idx.map(j=>q.o[j]),a:idx.indexOf(q.a)}});V.sc={i:0,ok:0,r:null,qs};render()});
    document.querySelectorAll('[data-sco]').forEach(b=>b.onclick=()=>{V.sc.r=+b.dataset.sco;if(V.sc.r===V.sc.qs[V.sc.i].a)V.sc.ok++;render()});
    $('scSig')&&($('scSig').onclick=()=>{V.sc.i++;V.sc.r=null;if(V.sc.i>=RETOS_SCALA.length){P.lab=P.lab||{};P.lab.scala=Math.max(P.lab.scala||0,Math.round(V.sc.ok/RETOS_SCALA.length*100));guardar()}render();window.scrollTo({top:0})});
  }
}

</script>
</body>
</html>
