<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C5CFF">
<title>Lumi · Aprende a tu ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3FF;--surface:#FFFFFF;--sunken:#EEEAFE;--ink:#2B2350;--muted:#6E6891;--line:#E4DEFA;--brand:#7C5CFF;--brand2:#9F87FF;--sun:#FFD43B;--ok:#16A34A;--ok-bg:#DCFCE7;--no:#E11D48;--no-bg:#FFE4E6;
  --shadow:0 2px 0 rgba(43,35,80,.08),0 10px 24px rgba(43,35,80,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122B;--surface:#221D42;--sunken:#1B1736;--ink:#F1EEFF;--muted:#B3ADD6;--line:#352E5E;--brand:#9F87FF;--brand2:#B9A8FF;--ok:#4ADE80;--ok-bg:#12351F;--no:#FB7185;--no-bg:#3B1624;--shadow:none}}
:root[data-theme="dark"]{--bg:#15122B;--surface:#221D42;--sunken:#1B1736;--ink:#F1EEFF;--muted:#B3ADD6;--line:#352E5E;--brand:#9F87FF;--brand2:#B9A8FF;--ok:#4ADE80;--ok-bg:#12351F;--no:#FB7185;--no-bg:#3B1624;--shadow:none}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100%;transition:background .4s;overflow-x:hidden;user-select:none;-webkit-user-select:none}
body[data-tema="mate"]{background:linear-gradient(180deg,#E0ECFF,var(--bg) 40%)}body[data-tema="letras"]{background:linear-gradient(180deg,#FFEDD5,var(--bg) 40%)}
body[data-tema="atencion"]{background:linear-gradient(180deg,#EDE4FF,var(--bg) 40%)}body[data-tema="emociones"]{background:linear-gradient(180deg,#FCE7F3,var(--bg) 40%)}body[data-tema="musica"]{background:linear-gradient(180deg,#D1FAE5,var(--bg) 40%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-tema]{background:var(--bg)}}
h1,h2,h3,b.big,.num,.letra{font-family:"Baloo 2","Nunito",system-ui,sans-serif}
h1{font-size:2rem;margin:0;line-height:1.1}h2{font-size:1.45rem;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:14px}
#app{max-width:560px;margin:0 auto;padding:10px 16px 110px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.top h2{flex:1;text-align:center;font-size:1.35rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:var(--shadow);position:relative;overflow:hidden}
.chip.ghost{background:transparent;box-shadow:none;font-size:.85rem;color:var(--muted)}
.chip.hold::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p,0%);background:var(--brand);transition:width .05s}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:800;box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.round:active,.op:active,.mundo:active,.act:active,.big-btn:active{transform:scale(.95)}
/* mascota */
.lumi{display:inline-block;flex:none}.lumi svg{display:block;overflow:visible}
.lumi .cuerpo{animation:vuela 3s ease-in-out infinite;transform-origin:60px 90px}
.lumi .halo{animation:brilla 2.2s ease-in-out infinite;transform-origin:60px 92px;opacity:.55}
.lumi .ala1{animation:ala .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}
.lumi .ala2{animation:ala .25s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:left center}
.lumi.festeja .cuerpo{animation:salta .6s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes vuela{50%{transform:translateY(-8px) rotate(-3deg)}}@keyframes brilla{50%{transform:scale(1.25);opacity:.9}}
@keyframes ala{to{transform:scaleY(.6)}}@keyframes salta{40%{transform:translateY(-22px) rotate(8deg)}}
/* inicio */
.hola{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--brand),#5B3FD9);color:#fff;border-radius:30px;padding:14px 18px;margin:4px 0 16px;box-shadow:0 12px 30px rgba(124,92,255,.35)}
.hola p{margin:4px 0 0;font-weight:700;opacity:.92}
.hola .lumi{background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.92) 0 52%,rgba(255,255,255,.25) 53% 62%,transparent 63%);border-radius:50%}
.mundos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mundo{border:0;border-radius:28px;padding:18px 12px;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 24px rgba(0,0,0,.1);animation:entra .5s cubic-bezier(.2,1.3,.4,1) both;min-height:132px;justify-content:center}
.mundo:last-child{grid-column:1/-1}
.mundo .me{font-size:3rem;line-height:1;animation:flota 3s ease-in-out infinite}.mundo b{font-family:"Baloo 2",sans-serif;font-size:1.35rem;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes entra{from{opacity:0;transform:scale(.8) translateY(20px)}}@keyframes flota{50%{transform:translateY(-5px)}}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.extra{border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);font-size:.92rem}
.extra span{font-size:2rem}
/* mundo */
.acts{display:grid;gap:12px}
.act{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--surface);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;animation:entra .45s both;min-height:84px}
.act .ae{font-size:2.4rem;width:60px;height:60px;display:grid;place-items:center;background:var(--sunken);border-radius:18px;flex:none}
.act b{flex:1;font-family:"Baloo 2",sans-serif;font-size:1.25rem}.act small{font-weight:800;color:var(--brand)}
.lumiside{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--muted);font-weight:700}
/* juego */
.top.game .dots{display:flex;gap:8px;flex:1;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:all .3s}.dots i.done{background:var(--ok)}.dots i.cur{background:var(--brand);transform:scale(1.35)}
.contador{font-weight:800;color:var(--muted)}
.preg{display:flex;flex-direction:column;gap:14px;animation:entra .35s both}
.enunciado{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:24px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid var(--line)}
.enunciado h2{flex:1}.voz{width:48px;height:48px;font-size:1.2rem}
b.big{font-size:2.4rem;color:var(--brand)}.cuenta{font-family:"Baloo 2",sans-serif;font-size:2.4rem}
.visual{background:var(--surface);border-radius:24px;padding:14px;display:flex;justify-content:center;border:2px dashed var(--line)}
.grupo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px;font-size:2rem}.grupo span{animation:entra .4s both}
.suma{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}.signo{font-size:2.4rem;font-weight:800;color:var(--brand)}
.cajas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.caja{border:3px solid var(--brand);border-radius:14px;padding:6px 10px;font-size:1.6rem;display:flex;align-items:center;gap:4px}.caja b{font-size:1rem;color:var(--brand)}
.serie{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.serie span{font-family:"Baloo 2",sans-serif;font-size:1.9rem;background:var(--sunken);border-radius:14px;min-width:58px;text-align:center;padding:4px 8px}.serie .q{background:var(--sun);color:#3a2a00}
.filas{font-size:1.1rem;letter-spacing:4px;color:var(--brand);line-height:1.3;text-align:center}
.emo{font-size:3rem;line-height:1}.emo.sm{font-size:2.1rem}.emo.xl{font-size:5rem}
.palabra{font-family:"Baloo 2",sans-serif;font-size:2rem;letter-spacing:4px}.hueco{background:var(--sun);color:#3a2a00;border-radius:8px;padding:0 8px}
.ops{display:grid;gap:12px}.ops.cols1{grid-template-columns:1fr}.ops.cols2{grid-template-columns:1fr 1fr}.ops.cols3{grid-template-columns:repeat(3,1fr)}.ops.cols4{grid-template-columns:repeat(4,1fr)}.ops.cols5{grid-template-columns:repeat(5,1fr)}
.op{border:3px solid var(--line);background:var(--surface);border-radius:22px;min-height:84px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 var(--line);animation:entra .4s both;transition:transform .12s,background .2s,border-color .2s}
.ops.cols4 .op,.ops.cols5 .op{min-height:60px;border-radius:16px;padding:4px}
.op .num,.op .letra{font-size:2.3rem;font-weight:800;line-height:1}.op .pal{font-weight:800;font-size:1.1rem;text-align:center}
.op.bien{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);animation:bien .5s}
.op.mal{background:var(--no-bg);border-color:var(--no);animation:tiembla .4s}.op:disabled:not(.bien){opacity:.55}
.op.ayuda{border-color:var(--sun);box-shadow:0 0 0 6px rgba(255,212,59,.5);animation:late 1s infinite}
.op.usado{opacity:.35}
@keyframes bien{50%{transform:scale(1.1)}}@keyframes tiembla{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes late{50%{transform:scale(1.06)}}
.lumibar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none}
/* memorama */
.memo{display:grid;gap:10px}.memo.c3{grid-template-columns:repeat(3,1fr)}.memo.c4{grid-template-columns:repeat(4,1fr)}
.carta{aspect-ratio:3/4;border:0;background:transparent;perspective:600px;position:relative;padding:0}
.carta span{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;font-size:2.2rem;backface-visibility:hidden;transition:transform .45s;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.carta .f{background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff}.carta .b{background:var(--surface);border:3px solid var(--line);transform:rotateY(180deg)}
.carta.abierta .f{transform:rotateY(180deg)}.carta.abierta .b{transform:rotateY(360deg)}.carta.hecha .b{border-color:var(--ok);background:var(--ok-bg)}
/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;margin:0 auto;width:100%}
.pad{aspect-ratio:1;border:0;border-radius:32px;background:var(--c);opacity:.5;transition:all .12s;box-shadow:0 6px 0 rgba(0,0,0,.15)}.pad.on{opacity:1;transform:scale(1.05);box-shadow:0 0 30px var(--c)}
/* estrella */
.campo{position:relative;height:52vh;min-height:320px;background:var(--surface);border-radius:28px;border:2px solid var(--line);overflow:hidden}
.obj{position:absolute;border:0;background:transparent;font-size:3.2rem;width:78px;height:78px;animation:aparece .3s cubic-bezier(.2,1.5,.4,1)}
.obj.pop{animation:pop .3s forwards}.obj.no{animation:tiembla .3s}@keyframes aparece{from{transform:scale(0)}}@keyframes pop{to{transform:scale(1.8);opacity:0}}
.tiempo{height:12px;background:var(--line);border-radius:8px;overflow:hidden}.tiempo b{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--sun));transition:width .3s linear}
/* xilófono */
.xilo{display:flex;gap:8px;align-items:center;justify-content:center;height:300px}
.bar{flex:1;max-width:64px;height:var(--h);background:var(--c);border:0;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#fff;font-weight:800;transition:transform .1s}
.bar.on{transform:translateY(4px) scale(.97);filter:brightness(1.2);box-shadow:0 2px 0 rgba(0,0,0,.18)}
/* ordenar */
.orden{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:p}
.orden li{counter-increment:p;display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:16px;padding:8px 12px;font-weight:800;min-height:54px;animation:entra .3s both}
.orden li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.orden li.vacio{background:transparent;border:2px dashed var(--line);animation:none}.orden li.vacio::before{background:var(--line)}
/* fin */
.fin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:30px}
.fin p{color:var(--muted);font-weight:700;max-width:34ch;margin:0}
.stars{display:flex;gap:6px;font-size:3.6rem}.stars span{color:var(--line);animation:estrella .6s cubic-bezier(.2,1.6,.4,1) both}.stars span.on{color:var(--sun);text-shadow:0 4px 0 #E0A800}
@keyframes estrella{from{transform:scale(0) rotate(-90deg)}}
.nuevo-sticker{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:3px dashed var(--sun);border-radius:24px;padding:12px 22px;animation:entra .6s .8s both}.nuevo-sticker span{font-size:3.5rem}
.finbtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px}
.big-btn{border:0;background:linear-gradient(135deg,var(--brand),#5B3FD9);color:#fff;font-family:"Baloo 2",sans-serif;font-size:1.35rem;border-radius:22px;padding:14px 28px;min-height:64px;box-shadow:0 6px 0 #4A31B8}
.big-btn:disabled{opacity:.55}
/* pausa */
.pausa{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:30px}.pausa h2{color:var(--muted);font-size:1.1rem}
.pe{font-size:6rem;animation:salta 1s ease-in-out infinite}
.ring{width:140px;height:140px}.rbg{fill:none;stroke:var(--line);stroke-width:10}.rfg{fill:none;stroke:var(--brand);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s linear}
.ring text{font-family:"Baloo 2",sans-serif;font-size:36px;fill:var(--ink);font-weight:800}
/* calma */
.calma{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:20px}.calma p{color:var(--muted);font-weight:700;max-width:32ch;margin:0}
.globo{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C4B5FD,#7C5CFF);display:grid;place-items:center;color:#fff;font-weight:800;padding:20px;box-shadow:0 20px 40px rgba(124,92,255,.35);transition:transform 4s ease-in-out}
.globo.inflar{transform:scale(1.45)}.globo.desinflar{transform:scale(1);transition-duration:4.5s}
/* rutina */
.tabs2{display:flex;gap:8px;margin-bottom:12px}.tabs2 button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;font-weight:800}.tabs2 button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.progreso{height:14px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}.progreso b{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#86EFAC);transition:width .5s}
.rutina{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.paso{width:100%;display:flex;align-items:center;gap:12px;border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:10px 14px;text-align:left;min-height:72px;transition:all .25s}
.paso .pe2{font-size:2.2rem}.paso b{flex:1;font-size:1.15rem}.paso .check{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff}
.paso.hecho{border-color:var(--ok);background:var(--ok-bg)}.paso.hecho b{text-decoration:line-through;opacity:.7}.paso.hecho .check{background:var(--ok);border-color:var(--ok);animation:bien .4s}
.bien{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--surface);border-radius:22px;padding:10px 14px;box-shadow:var(--shadow)}
/* álbum */
.center{text-align:center;color:var(--muted);font-weight:700}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.st{aspect-ratio:1;display:grid;place-items:center;font-size:2.2rem;background:var(--surface);border-radius:18px;border:2px solid var(--line);animation:entra .4s both}
.st.lock{color:var(--line);font-family:"Baloo 2";font-size:1.6rem;background:var(--sunken)}
/* papás */
.padres{display:grid;gap:14px}.pcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;user-select:text;-webkit-user-select:text}
.pcard h3{font-size:1.2rem;margin:0 0 10px}.pcard label{display:flex;flex-direction:column;gap:6px;font-weight:800;margin-bottom:12px;font-size:.95rem}
.pcard input[type=text],.pcard input:not([type]){border:2px solid var(--line);background:var(--sunken);border-radius:12px;padding:10px 12px;font:inherit}
.pcard .sw{flex-direction:row;align-items:center;gap:10px;font-weight:700}.pcard .sw input{width:24px;height:24px;accent-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;border:2px solid var(--line);background:var(--sunken);border-radius:14px;padding:8px;font-weight:800;display:flex;flex-direction:column;align-items:center;font-size:.95rem}
.seg button small{font-weight:600;color:var(--muted);font-size:.75rem}.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}.seg button[aria-pressed="true"] small{color:#fff}
.muted{color:var(--muted);font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:800;padding:4px 0;text-decoration:underline}.linkbtn.danger{color:var(--no)}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
'use strict';
/* ================== Datos ================== */
const EDADES={1:{n:'Pequeños',d:'4 a 6 años'},2:{n:'Medianos',d:'6 a 9 años'},3:{n:'Grandes',d:'9 a 12 años'}};
const MUNDOS=[
 {id:'mate',n:'Números',e:'🔢',c1:'#3B82F6',c2:'#60A5FA',acts:[{id:'contar',n:'Cuenta',e:'🍎'},{id:'sumas',n:'Suma y resta',e:'➕'},{id:'sigue',n:'¿Qué sigue?',e:'🔜'},{id:'multi',n:'Multiplica',e:'✖️',edades:[3]}]},
 {id:'letras',n:'Letras',e:'🔤',c1:'#F97316',c2:'#FDBA74',acts:[{id:'letra',n:'Letras y sonidos',e:'🅰️'},{id:'palabra',n:'Palabras',e:'🖼️'},{id:'frase',n:'Completa la frase',e:'📖',edades:[2,3]}]},
 {id:'atencion',n:'Atención',e:'🧠',c1:'#8B5CF6',c2:'#C4B5FD',acts:[{id:'memorama',n:'Memorama',e:'🃏'},{id:'simon',n:'Simón dice',e:'🔴'},{id:'estrella',n:'Solo la estrella',e:'⭐'},{id:'diferente',n:'Encuentra el diferente',e:'🔍'}]},
 {id:'emociones',n:'Emociones',e:'💛',c1:'#EC4899',c2:'#F9A8D4',acts:[{id:'sentir',n:'¿Cómo se siente?',e:'😊'},{id:'hacer',n:'¿Qué puedo hacer?',e:'🤝'},{id:'ordenar',n:'Ordena la rutina',e:'📋'}]},

let VOZ=null;function elegirVoz(){const vs=speechSynthesis.getVoices();VOZ=vs.find(v=>/es[-_]MX/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function hablar(t,forzar){if(!('speechSynthesis' in window)||(!P.voz&&!forzar))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/___/g,'mmm'));u.lang='es-MX';if(VOZ)u.voice=VOZ;u.rate=0.92;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let AC=null;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tono(f,t0=0,dur=0.35,vol=0.2,tipo='sine'){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=tipo;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05)}
const sfx={ok(){tono(660,0,.18,.18,'triangle');tono(880,.1,.25,.18,'triangle');tono(1320,.2,.35,.12,'sine')},err(){tono(300,0,.25,.12,'sine');tono(250,.12,.3,.1,'sine')},
  tap(){tono(520,0,.08,.08,'triangle')},gana(){[523,659,784,1047].forEach((f,i)=>tono(f,i*.12,.45,.16,'triangle'))},
  aplauso(t0=0){const c=ac(),n=c.sampleRate*0.12,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.15));const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;g.gain.value=0.6;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+t0)}};
const XILO=[{f:523.25,c:'#EF4444',n:'Do'},{f:587.33,c:'#F97316',n:'Re'},{f:659.25,c:'#EAB308',n:'Mi'},{f:783.99,c:'#22C55E',n:'Sol'},{f:880,c:'#3B82F6',n:'La'},{f:1046.5,c:'#8B5CF6',n:'Do'}];
function xilo(i,t0=0){tono(XILO[i].f,t0,.6,.2,'triangle');tono(XILO[i].f*2,t0,.3,.05,'sine')}

function confeti(n=90){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('confeti'),x=cv.getContext('2d'),dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFD43B','#7C5CFF','#3B82F6','#EC4899','#10B981','#F97316'],ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:5+Math.random()*6,c:pick(cols),a:0,va:(Math.random()-.5)*.3}));
  const t0=performance.now();(function f(t){const d=t-t0;x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-d/2000);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(d<2000)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0)}

  else if(v==='mundo')app.innerHTML=vMundo();
  else if(v==='juego')iniciarJuego();
  else if(v==='fin')app.innerHTML=vFin();
  else if(v==='pausa')app.innerHTML=vPausa();
  else if(v==='calma')app.innerHTML=vCalma();
  else if(v==='rutina')app.innerHTML=vRutina();

/* ================== Montaje de eventos ================== */
function montar(){
  const pb=$('padresBtn');if(pb)puertaPadres(pb);
  const next=document.querySelector('[data-next]');if(next)next.onclick=()=>{if(tiempoAgotado())return ir({vista:'descanso'});P.pausas?ir({vista:'pausa',mundo:V.mundo}):ir({vista:'mundo',mundo:V.mundo})};
  if(V.vista==='pausa')iniciarPausa();
  if(V.vista==='calma')$('respirar').onclick=$('globo').onclick=respirar;
  if(V.vista==='padres')montarPadres();
  if(V.vista==='inicio')hablar(P.nombre?`Hola ${P.nombre}. ¿A qué mundo vamos hoy?`:'¡Hola! ¿A qué mundo vamos hoy?');

    later(()=>{if(!tocado&&esEst)M.fallos++;el.remove()},vel*1.4)};
  const loop=()=>{const r=M.fin-Date.now();const tb=$('tbar');if(!tb)return;tb.style.width=Math.max(0,r/(dur*1000)*100)+'%';
    if(r<=0){const tot=M.aciertos+M.errores+M.fallos,prec=tot?M.aciertos/tot:0;return later(()=>terminar(prec>=.8?3:prec>=.6?2:1,`Tocaste ${M.aciertos} estrellas.`),800)}salir();later(loop,vel)};
  later(loop,1800);
}
function jMelodia(){
  const n0=P.edad===1?2:P.edad===2?3:4,rondas=3;M={act:'melodia',errores:0,aciertos:0,r:0,seq:[],pos:0,turno:false};
  $('app').innerHTML=marco(`<span class="contador" id="cont">1 de ${rondas}</span>`)+`<section class="preg"><div class="enunciado"><h2 id="mTxt">Escucha la melodía…</h2></div>${xiloHTML()}</section><div class="lumibar" id="lumibar">${lumi(64,'feliz')}</div>`;
  const barras=[...document.querySelectorAll('.bar')];
  const toca=(i,t0)=>later(()=>{barras[i].classList.add('on');xilo(i);later(()=>barras[i].classList.remove('on'),300)},t0);
  const nueva=()=>{M.seq=Array.from({length:n0+M.r},()=>rnd(P.edad===1?3:5));M.pos=0;M.turno=false;$('mTxt').textContent='Escucha la melodía…';M.seq.forEach((c,k)=>toca(c,500+k*650));later(()=>{M.turno=true;$('mTxt').textContent='¡Ahora tú!'},500+M.seq.length*650)};
  barras.forEach((b,i)=>b.onclick=()=>{toca(i,0);if(!M.turno)return;
    if(i===M.seq[M.pos]){M.pos++;if(M.pos===M.seq.length){M.turno=false;M.aciertos++;M.r++;sfx.ok();confeti(30);if(M.r>=rondas)return later(()=>terminar(M.errores<=1?3:M.errores<=3?2:1,'¡Eres todo un músico!'),900);$('cont').textContent=`${M.r+1} de ${rondas}`;later(nueva,1200)}}
    else{M.errores++;M.turno=false;$('mTxt').textContent='Escuchemos otra vez';later(()=>{M.pos=0;M.seq.forEach((c,k)=>toca(c,300+k*650));later(()=>{M.turno=true;$('mTxt').textContent='¡Ahora tú!'},300+M.seq.length*650)},700)}});
  hablar('Escucha la melodía y repítela en el xilófono');later(nueva,1600);
}
function xiloHTML(todas){const n=todas||P.edad>1?XILO.length:3;return `<div class="xilo">${XILO.slice(0,n).map((x,i)=>`<button class="bar" style="--c:${x.c};--h:${100-i*9}%" aria-label="${x.n}"><span>${x.n}</span></button>`).join('')}</div>`}
function jLibre(){M={act:'libre',stop(){}};$('app').innerHTML=marco('<span class="contador">Toca libre</span>')+`<section class="preg"><div class="enunciado"><h2>¡Inventa tu canción!</h2></div>${xiloHTML(true)}</section>`;
  document.querySelectorAll('.bar').forEach((b,i)=>b.onpointerdown=()=>{xilo(i);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),250)});hablar('Toca las barras para hacer música')}
function jOrdenar(){
  const k=pick(Object.keys(RUTINAS)),n=P.edad===1?3:P.edad===2?4:5,todos=RUTINAS[k].p,ini=rnd(todos.length-n+1),pasos=todos.slice(ini,ini+n);
  M={act:'ordenar',errores:0,aciertos:0,sig:0};
  $('app').innerHTML=marco(`<span class="contador">${RUTINAS[k].e} ${RUTINAS[k].n}</span>`)+`<section class="preg"><div class="enunciado"><h2>¿Qué va primero? Toca en orden</h2></div>
    <ol class="orden" id="orden">${pasos.map(()=>'<li class="vacio"></li>').join('')}</ol>
    <div class="ops cols2">${barajar(pasos.map((p,i)=>({p,i}))).map(({p,i})=>`<button class="op" data-i="${i}"><span class="emo sm">${p[1]}</span><span class="pal">${esc(p[0])}</span></button>`).join('')}</div></section><div class="lumibar" id="lumibar">${lumi(64,'feliz')}</div>`;
  hablar('Ordena los pasos. ¿Qué va primero?');
  document.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(i===M.sig){const li=$('orden').children[M.sig];li.className='';li.innerHTML=`<span class="emo sm">${pasos[i][1]}</span>${esc(pasos[i][0])}`;b.disabled=true;b.classList.add('usado');sfx.ok();M.sig++;M.aciertos++;
      if(M.sig===n)later(()=>terminar(M.errores<=1?3:M.errores<=3?2:1,'¡Tu rutina está en orden!'),900);else hablar('¿Y después?')}
    else{M.errores++;sfx.err();b.classList.add('mal');later(()=>b.classList.remove('mal'),500);hablar('Mmm, eso va después')}});
}

(async function(){
  try{const d=JSON.parse(localStorage.getItem(LKEY)||'null');if(d)P={...P,...d}}catch(e){}
  render();
  if(window.claude&&typeof window.claude.use==='function'){
    const [db,user]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null)]);
    if(db&&user){DB=db;try{const s=await db.doc('data/users/me/lumi').get();if(s.exists){const r=s.data();if((r.estrellas||0)>=(P.estrellas||0)){P={...P,...r};if(V.vista==='inicio')render()}}}catch(e){DB=null}}
  }
})();
